<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V.Stream - Eksklusif</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .push-banner {
            transition: all 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }
        .push-banner.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
            animation: blinkEffect 3.5s infinite ease-in-out;
        }

        /* Animasi kedap-kedip slow */
        @keyframes blinkEffect {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* Modal popup tengah dengan latar belakang gelap penutup layar (backdrop) */
        .modal-overlay {
            transition: all 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVIGASI -->
    <header class="bg-red-600 border-b border-red-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <i class="fa-solid fa-play-circle text-white text-2xl sm:text-3xl"></i>
                <span class="font-bold text-lg sm:text-xl tracking-wide text-white">V.Stream</span>
            </div>
            <!-- Pencarian -->
            <div class="w-48 sm:w-80 md:w-96 relative">
                <input type="text" id="searchInput" placeholder="Cari video..." 
                    class="w-full bg-white text-slate-800 border border-red-300 rounded-full px-4 py-2 pl-10 text-xs sm:text-sm focus:outline-none focus:border-red-600 shadow-inner">
                <i class="fa-solid fa-search absolute left-3.5 top-2.5 sm:top-3 text-red-500 text-xs sm:text-sm"></i>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow">
        
        <!-- BAGIAN PEMUTAR VIDEO -->
        <section class="mb-10 max-w-5xl mx-auto">
            <h2 id="currentVideoTitle" class="text-lg sm:text-2xl font-bold mb-3 text-slate-900 leading-snug">Memuat Video...</h2>
            
            <!-- WADAH PEMUTAR VIDEO -->
            <div id="playerContainer" class="relative bg-black rounded-2xl overflow-hidden shadow-2xl w-full aspect-[16/9] flex items-center justify-center border-2 border-red-500/30">
                
                <!-- TOMBOL PLAY AWAL -->
                <div id="playOverlay" onclick="startVideoAndPush()" class="absolute inset-0 z-40 bg-black/50 flex flex-col items-center justify-center cursor-pointer transition hover:bg-black/40">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-red-600 flex items-center justify-center shadow-2xl transform transition hover:scale-110 text-white text-xl sm:text-2xl pl-1">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span class="text-white text-xs sm:text-sm font-bold mt-3 tracking-wide bg-red-600/80 px-4 py-1.5 rounded-full shadow-lg">Klik Untuk Putar Video</span>
                </div>

                <!-- IN-PAGE PUSH ATAS -->
                <div id="pushTop" class="push-banner absolute top-3 left-3 right-3 z-30 bg-red-950/95 backdrop-blur-md border border-red-500/60 rounded-xl p-2.5 shadow-lg flex items-center justify-between gap-3">
                    <div class="flex items-center gap-2.5 cursor-pointer flex-grow overflow-hidden" onclick="triggerSmartlink()">
                        <div id="pushTopIcon" class="w-8 h-8 rounded-lg bg-red-700 flex items-center justify-center text-base flex-shrink-0 text-white">🚀</div>
                        <div class="truncate">
                            <h4 id="pushTopTitle" class="text-[11px] sm:text-xs font-semibold text-red-200 truncate">Penawaran Spesial</h4>
                            <p id="pushTopText" class="text-[11px] sm:text-xs font-bold text-white truncate">Dapatkan bonus eksklusif sekarang juga!</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 flex-shrink-0">
                        <button onclick="triggerSmartlink()" class="bg-red-600 hover:bg-red-700 text-white text-[10px] sm:text-[11px] font-bold px-2.5 py-1 rounded-lg transition">Klaim</button>
                        <button onclick="closePush('top')" class="text-red-300 hover:text-white px-1"><i class="fa-solid fa-xmark text-base"></i></button>
                    </div>
                </div>

                <!-- IFRAME PLAYER -->
                <iframe id="mainVideoPlayer" src="" class="w-full h-full border-0" frameborder="0" allowfullscreen></iframe>

            </div>

            <!-- KONTROL VIDEO -->
            <div class="flex items-center justify-between mt-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                <span id="currentVideoCategory" class="text-xs bg-red-600 text-white px-3 py-1 rounded-full font-medium">Kategori</span>
                <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="shareVideo()" class="text-xs sm:text-sm bg-slate-50 hover:bg-red-50 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-2 transition">
                        <i class="fa-solid fa-share-nodes text-red-600"></i> Bagikan
                    </button>
                    <button onclick="toggleFullscreen()" class="text-xs sm:text-sm bg-slate-50 hover:bg-red-50 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-2 transition">
                        <i class="fa-solid fa-expand text-red-600"></i> Layar Penuh
                    </button>
                </div>
            </div>
        </section>

        <!-- KATEGORI & DAFTAR VIDEO -->
        <section>
            <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                <h3 class="text-lg font-bold text-slate-900">Daftar Video</h3>
                <div id="categoryFilters" class="flex gap-2 overflow-x-auto pb-1 max-w-full">
                    <button onclick="filterCategory('Semua')" class="cat-btn bg-red-600 text-white text-xs px-3 py-1.5 rounded-full font-medium transition shadow-sm">Semua</button>
                </div>
            </div>

            <!-- Grid Video -->
            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

            <!-- Pagination -->
            <div class="flex justify-center items-center gap-3 mt-8">
                <button id="prevPage" onclick="changePage(-1)" class="bg-white border border-slate-200 text-slate-700 hover:bg-red-50 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">Sebelumnya</button>
                <span id="pageInfo" class="text-xs sm:text-sm font-medium text-slate-600">Hal 1 dari 4</span>
                <button id="nextPage" onclick="changePage(1)" class="bg-white border border-slate-200 text-slate-700 hover:bg-red-50 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold disabled:opacity-40 disabled:cursor-not-allowed shadow-sm">Selanjutnya</button>
            </div>
        </section>

    </main>

    <!-- MODAL POPUP CHAT ADMIN BERURUTAN (TOMBOL X JUGA MEMBUKA SMARTLINK) -->
    <div id="centerModal" class="modal-overlay fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-6 sm:p-8 relative flex flex-col gap-5 border border-slate-100">
            <!-- Tombol Close (X) Membuka Smartlink -->
            <button onclick="triggerSmartlink()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 hover:bg-red-100 text-slate-500 hover:text-red-600 flex items-center justify-center transition font-bold text-base z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Informasi Admin -->
            <div class="flex items-center gap-4 cursor-pointer pr-8" onclick="triggerSmartlink()">
                <div class="relative flex-shrink-0">
                    <img src="https://i.ibb.co.com/LhY0hZpK/adb5c19a3fa43908058f009dd4ee995a.jpg" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover border-2 border-red-600 shadow-md">
                    <span class="absolute bottom-0 right-0 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full animate-pulse"></span>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h4 id="adminModalTitle" class="text-base sm:text-lg font-bold text-red-600">Admin Online</h4>
                        <span class="text-[11px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold">Online</span>
                    </div>
                    <p id="adminModalText" class="text-sm sm:text-base text-slate-800 font-medium mt-1.5 leading-snug">Halo Kak, mau dibantu pola gacor malam ini?</p>
                </div>
            </div>

            <!-- Tombol Aksi Chat Berubah Sesuai Alur -->
            <button id="adminModalBtn" onclick="triggerSmartlink()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition text-sm sm:text-base tracking-wide">
                Mulai Chat Sekarang
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-red-600 border-t border-red-700 py-4 text-center text-xs text-white">
        &copy; 2026 V.Stream. Hak Cipta Dilindungi.
    </footer>

    <!-- SKRIP UTAMA -->
    <script>
        const SMARTLINK_URL = "https://www.profitableratecpmnetwork.com/i5gpw4k52u?key=fe139b5529deb5921915d705b9e976d2";

        const videosData = [
            { id: 1, title: "Goyangan Hot Menggoda Bikin Lemes di Kamar", category: "Hot", embedUrl: "https://trbnvideo.live/e/jqUE2s1j", poster: "https://i.ibb.co.com/3mr8M7v7/1793767600887.jpg" },
            { id: 2, title: "Desahan Manja Pacar Cantik Pas Berduaan", category: "Hot", embedUrl: "https://trbnvideo.live/e/rkB2lJU0", poster: "https://i.ibb.co.com/9mBnCGtS/1793767589103.jpg" },
            { id: 3, title: "Aksi Nakal Malam Jumat Bikin Ketagihan", category: "Sensual", embedUrl: "https://trbnvideo.live/e/rF4FRrTZ", poster: "https://i.ibb.co.com/M52PQp5p/1793767574587.jpg" },
            { id: 4, title: "Minta Jatah Duluan Gegara Suami Pulang Malam", category: "Sensual", embedUrl: "https://trbnvideo.live/e/CJqvagsK", poster: "https://i.ibb.co.com/0VXctt0x/1793767508529.jpg" },
            { id: 5, title: "Buka-bukanan di Kosan Sambil Main Licin", category: "Eksklusif", embedUrl: "https://trbnvideo.live/e/10VFNLlE", poster: "https://i.ibb.co.com/v4gL0StF/1793767490790.jpg" },
            { id: 6, title: "Gadis Montok Ngajak 'Main' Tanpa Busana", category: "Eksklusif", embedUrl: "https://trbnvideo.live/e/2buj45jB", poster: "https://i.ibb.co.com/xKxy1wqZ/1793767469519.jpg" },
            { id: 7, title: "Sentuhan Lembut Area Sensitif Bikin Basah", category: "Hot", embedUrl: "https://trbnvideo.live/e/kTSpjon2", poster: "https://i.ibb.co.com/v6tCJFCc/1793767451951.jpg" },
            { id: 8, title: "Nikmatnya Layani 'Tamu' Spesial Sampai Pagi", category: "Hot", embedUrl: "https://trbnvideo.live/e/nQ29SZ0p", poster: "https://i.ibb.co.com/DPBQHxhZ/1793767445024.jpg" },
            { id: 9, title: "Main Kucing-kucingan Berdua Tanpa Sehelai Benang", category: "Sensual", embedUrl: "https://trbnvideo.live/e/O6iFeyex", poster: "https://i.ibb.co.com/cS2QGnLf/e89771e819d28a1ae0388d2af852d2f9.jpg" },
            { id: 10, title: "Digoyang Erotis Sampai Lemas Tak Berdaya", category: "Sensual", embedUrl: "https://trbnvideo.live/e/7Ig1S0Yc", poster: "https://i.ibb.co.com/qMDYTsbY/ae5557d0a21d9be9169a2019329f8e5d.jpg" },
            { id: 11, title: "Aksi Panas Diatas Ranjang Sambil Desah Manja", category: "Eksklusif", embedUrl: "https://trbnvideo.live/e/yYcAJtcH", poster: "https://i.ibb.co.com/4ZsVhJkR/1790091907304.jpg" },
            { id: 12, title: "Pamer Tubuh Mulus Sembari Minta Diterkam", category: "Eksklusif", embedUrl: "https://trbnvideo.live/e/4O1gPMCe", poster: "https://i.ibb.co.com/Rqw6xhJ/1790091869047.jpg" },
            { id: 13, title: "Gaya Nungging Paling Dicari Bikin Nafsu Naik", category: "Terbaru", embedUrl: "https://trbnvideo.live/e/lSCeUX2g", poster: "https://i.ibb.co.com/4wsHyS8n/1793065681242.jpg" },
            { id: 14, title: "Pelukan Erat Sambil Saling Cumbu di Dalam Kamar", category: "Terbaru", embedUrl: "https://trbnvideo.live/e/q2Zg5y2K", poster: "https://i.ibb.co.com/7dfrRv4k/1793129144788.jpg" },
            { id: 15, title: "Sentuhan Nakal Bikin Merinding Sekujur Tubuh", category: "Terbaru", embedUrl: "https://trbnvideo.live/e/10VFNLlE", poster: "https://i.ibb.co.com/Z6qpYMWZ/IMG-20261104-100544-611.jpg" },
            { id: 16, title: "Durasi Panjang Puas Main Basah-basahan", category: "Terbaru", embedUrl: "https://trbnvideo.live/e/l8lwFSp5", poster: "https://i.ibb.co.com/2H47tZc/IMG-20261104-100540-372.jpg" }
        ];

        // Alur Percakapan Admin Judol Bersambung (Looping)
        const chatConversation = [
            {
                title: "Admin Online",
                text: "Halo Kak, mau dibantu pola gacor malam ini?",
                btnText: "Mulai Chat Sekarang"
            },
            {
                title: "CS Official",
                text: "Boleh tahu modal awal Kakak berapa sekarang?",
                btnText: "Kasih Tahu Modal"
            },
            {
                title: "Admin Gacor",
                text: "Oke Kak, ini saya kirimkan link RTP & pola maxwin khusus member baru ya.",
                btnText: "Ambil Pola Sekarang"
            },
            {
                title: "CS Official",
                text: "Jangan lupa depo via QRIS/E-wallet ya Kak biar langsung masuk instan.",
                btnText: "Konfirmasi Deposit"
            }
        ];

        let currentChatIndex = 0;
        let pushTopCount = 0;
        const MAX_PUSH_PER_VIDEO = 5;
        let topTimer = null;
        let modalTimer = null;

        let currentActiveVideoId = null;
        let currentPage = 1;
        const itemsPerPage = 4;
        let currentCategory = "Semua";
        let searchQuery = "";

        function triggerSmartlink() {
            window.open(SMARTLINK_URL, '_blank');
            closeModalPopup();
        }

        // Fungsi tutup popup: buka smartlink, ganti ke teks chat berikutnya, lalu muncul lagi setelah 10 detik
        function closeModalPopup() {
            const modal = document.getElementById('centerModal');
            modal.classList.remove('active');
            
            // Geser ke chat berikutnya secara berurutan, kalau habis balik ke awal (looping)
            currentChatIndex = (currentChatIndex + 1) % chatConversation.length;

            clearTimeout(modalTimer);
            modalTimer = setTimeout(() => {
                showModalPopup();
            }, 10000); // 10 detik
        }

        function showModalPopup() {
            const currentChat = chatConversation[currentChatIndex];
            document.getElementById('adminModalTitle').innerText = currentChat.title;
            document.getElementById('adminModalText').innerText = currentChat.text;
            document.getElementById('adminModalBtn').innerText = currentChat.btnText;

            const modal = document.getElementById('centerModal');
            modal.classList.add('active');
        }

        function initApp() {
            setupCategories();
            renderVideos();
            prepareVideo(videosData[0].id);

            // Modal popup chat admin alur pertama muncul 1 detik setelah halaman dibuka
            setTimeout(() => {
                showModalPopup();
            }, 1000);
        }

        function prepareVideo(id) {
            const video = videosData.find(v => v.id === id);
            if (!video) return;

            currentActiveVideoId = id;
            document.getElementById('currentVideoTitle').innerText = video.title;
            document.getElementById('currentVideoCategory').innerText = video.category;
            
            document.getElementById('pushTop').classList.remove('active');
            
            document.getElementById('playOverlay').style.display = 'flex';
            document.getElementById('mainVideoPlayer').src = "";
        }

        function startVideoAndPush() {
            const video = videosData.find(v => v.id === currentActiveVideoId);
            if (!video) return;

            const iframe = document.getElementById('mainVideoPlayer');
            iframe.src = video.embedUrl;

            document.getElementById('playOverlay').style.display = 'none';

            pushTopCount = 0;
            clearTimeout(topTimer);

            showPush('top');
        }

        function selectVideo(id) {
            prepareVideo(id);
            startVideoAndPush();
        }

        function showPush(position) {
            if (position === 'top' && pushTopCount >= MAX_PUSH_PER_VIDEO) return;

            const pushVariations = [
                { icon: "🚀", title: "Flash Sale Eksklusif", text: "Akses penawaran spesial terbatas hari ini!" },
                { icon: "💎", title: "Bonus Spesial Member", text: "Klik di sini untuk klaim hadiah harianmu." }
            ];
            const randomVar = pushVariations[Math.floor(Math.random() * pushVariations.length)];
            
            if (position === 'top') {
                pushTopCount++;
                document.getElementById('pushTopIcon').innerText = randomVar.icon;
                document.getElementById('pushTopTitle').innerText = randomVar.title;
                document.getElementById('pushTopText').innerText = randomVar.text;
                document.getElementById('pushTop').classList.add('active');
            }
        }

        function closePush(position) {
            triggerSmartlink();

            if (position === 'top') {
                document.getElementById('pushTop').classList.remove('active');
                if (pushTopCount < MAX_PUSH_PER_VIDEO) {
                    topTimer = setTimeout(() => showPush('top'), 5000);
                }
            }
        }

        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            let filtered = videosData.filter(v => {
                const matchCat = currentCategory === "Semua" || v.category === currentCategory;
                const matchSearch = v.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filtered.slice(start, start + itemsPerPage);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500">Tidak ada video ditemukan.</div>`;
            } else {
                paginatedItems.forEach(video => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl overflow-hidden border border-slate-200 hover:border-red-600 transition cursor-pointer flex flex-col justify-between shadow-sm";
                    
                    card.onclick = () => {
                        selectVideo(video.id);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };

                    card.innerHTML = `
                        <div class="relative w-full h-36 sm:h-40 bg-slate-100 overflow-hidden flex items-center justify-center">
                            <img src="${video.poster}" alt="${video.title}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/30 flex items-center justify-center play-btn-wrapper" onclick="event.stopPropagation(); handleThumbnailPlay(${video.id})">
                                <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center shadow-lg transform transition hover:scale-110 text-white">
                                    <i class="fa-solid fa-play text-sm ml-0.5"></i>
                                </div>
                            </div>
                        </div>
                        <div class="p-3">
                            <span class="text-[9px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold">${video.category}</span>
                            <h4 class="text-xs sm:text-sm font-bold text-slate-800 mt-1.5 line-clamp-2 leading-snug">${video.title}</h4>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            document.getElementById('pageInfo').innerText = `Hal ${currentPage} dari ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function handleThumbnailPlay(id) {
            triggerSmartlink();
            selectVideo(id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupCategories() {
            const categories = ["Semua", ...new Set(videosData.map(v => v.category))];
            const container = document.getElementById('categoryFilters');
            container.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn text-xs px-3 py-1.5 rounded-full font-medium transition shadow-sm ${cat === currentCategory ? 'bg-red-600 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    currentPage = 1;
                    renderVideos();
                    document.querySelectorAll('.cat-btn').forEach(b => {
                        b.classList.remove('bg-red-600', 'text-white');
                        b.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-700');
                    });
                    btn.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-700');
                    btn.classList.add('bg-red-600', 'text-white');
                };
                container.appendChild(btn);
            });
        }

        function changePage(direction) {
            currentPage += direction;
            renderVideos();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 1;
            renderVideos();
        });

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: document.getElementById('currentVideoTitle').innerText,
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Tautan video berhasil disalin ke clipboard!");
            }
        }

        function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
            }
        }

        window.onload = initApp;
    </script>

    <!-- KODE POPUNDER ADSTERRA -->
    <script src="https://pl30410625.profitableratecpmnetwork.com/dd/a8/36/dda8365aecb13e4cb7620d95645bb3d8.js"></script>

</body>
</html>
